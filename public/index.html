<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Quản Lý Chi Tiêu</title>
    
    <!-- PWA & Apple Safari Mobile Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chi Tiêu" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="Ứng dụng quản lý thu chi cá nhân thông minh, tiện lợi" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons (iOS Safari Add to Home Screen) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
      /* Khai báo font Ionicons trực tiếp cho Web / PWA */
      @font-face {
        font-family: 'ionicons';
        src: url('/fonts/Ionicons.ttf') format('truetype');
        font-display: swap;
      }
      @font-face {
        font-family: 'Ionicons';
        src: url('/fonts/Ionicons.ttf') format('truetype');
        font-display: swap;
      }

      /* Đảm bảo toàn bộ viewport full 100% chuẩn native app */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #F1F5F9;
      }

      /* Đảm bảo các container cuộn của React Native Web cuộn mượt mà không bị kẹt */
      [style*="overflow-y: auto"],
      [style*="overflow: auto"],
      .r-overflowY-eqz5dr {
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overscroll-behavior-y: contain;
      }

      /* Tùy chỉnh thanh cuộn đẹp mắt trên trình duyệt */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Chống zoom ngoài ý muốn khi chạm nhanh trên iOS Safari */
      button, input, select, textarea {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <!-- Container root của Expo / React Native Web -->
    <noscript>Vui lòng kích hoạt JavaScript để sử dụng ứng dụng Quản Lý Chi Tiêu.</noscript>
    <div id="root"></div>
  </body>
</html>
